[project]
site_name = "calpdf"
site_description = "A simple PDF toolkit to run alongside Calibre."
site_url = "https://athaurian.github.io/calpdf/"
repo_url = "https://github.com/athaurian/calpdf"
repo_name = "athaurian/calpdf"
edit_uri = "edit/main/docs/"
copyright = """
<span>Made with ❤️ and <a href="https://zensical.org">Zensical</a></span> <span>Content licensed under <a href="https://github.com/athaurian/calpdf/blob/main/LICENSE">MIT</a></span>
"""

extra_css = [
  "https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300..900;1,300..900&display=fallback",
  "stylesheets/asciinema-player.css",
  "stylesheets/extra.css",
  "stylesheets/calpdf.css",
]

extra_javascript = [
  "javascripts/asciinema-player.min.js",
  "javascripts/asciinema.js",
]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Calibre plugin" = "calibre.md" },
  { "Global options" = "global-options.md" },
  { "Commands" = [
      { "replace-cover" = "commands/replace-cover.md" },
      { "dl-cover" = "commands/dl-cover.md" },
      { "set-cover" = "commands/set-cover.md" },
      { "extract-cover" = "commands/extract-cover.md" },
      { "optimize" = "commands/optimize.md" },
      { "info" = "commands/info.md" },
      { "export-toc" = "commands/export-toc.md" },
      { "apply-toc" = "commands/apply-toc.md" },
      { "restore" = "commands/restore.md" },
    ] },
  { "Reference" = [
      { "The ToC JSON format" = "reference/toc-json-format.md" },
      { "Backup behavior" = "reference/backup-behavior.md" },
    ] },
  { "Development" = "development.md" },
]

[project.theme]
variant = "modern"
font = false
logo = "favicon.svg"
favicon = "https://athaurian.github.io/calpdf/favicon.ico"
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
]

custom_dir = "overrides"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
zensical.extensions.glightbox.auto_themed = true
def_list = {}
footnotes = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true

[project.extra]
generator = false
homepage = "."
oembed = "oembed.json"
